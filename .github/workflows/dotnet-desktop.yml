name: RMCL 自动构建

on:
  workflow_dispatch:
  push:
    branches: ["4.0"]

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.date.outputs.version }}
      y: ${{ steps.date.outputs.y }}
      md: ${{ steps.date.outputs.md }}
      hm: ${{ steps.date.outputs.hm }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Generate version
        id: date
        # echo "version=$(date +'%Y.%m%d.%H.%M')" >> $GITHUB_OUTPUT
        # 上面是旧的生成版本号
        run: |
          echo "version=4.0.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "y=$(date +'%Y')" >> $GITHUB_OUTPUT
          echo "md=$(date +'%m%d')" >> $GITHUB_OUTPUT
          echo "hm=$(date +'%H%M')" >> $GITHUB_OUTPUT
      - name: Show version
        run: |
          echo "Build version: ${{ steps.date.outputs.version }}"

  # Windows 平台构建
  win-x86:
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Sub-Module
        run: |
          git pull
          git submodule update --init --recursive --remote

      - name: Build (x86)
        run: |
          cd ./src/RMCL
          dotnet publish -c Release -r win-x86 `
            /p:PublishSingleFile=true `
            /p:PublishReadyToRun=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:SelfContained=true `
            /p:Version=${{ needs.version.outputs.v }} `
            -o "../../publish/win-x86" -p:DebugType=none -p:DebugSymbols=false
      
      - name: Create ZIP (x86)
        run: |
          Compress-Archive -Path "./publish/win-x86/*" -DestinationPath "./RMCL4-${{ needs.version.outputs.v }}.win-x86.zip" -Force
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RMCL.win-x86.zip
          path: "./RMCL4-${{ needs.version.outputs.v }}.win-x86.zip"

  win-x64:
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Sub-Module
        run: |
          git pull
          git submodule update --init --recursive --remote
          
      
      - name: Build (x64)
        run: |
          cd ./src/RMCL
          dotnet publish -c Release -r win-x64 `
            /p:PublishSingleFile=true `
            /p:PublishReadyToRun=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:SelfContained=true `
            /p:Version=${{ needs.version.outputs.v }} `
            -o "../../publish/win-x64" -p:DebugType=none -p:DebugSymbols=false
      
      - name: Create ZIP (x64)
        run: |
          Compress-Archive -Path "./publish/win-x64/*" -DestinationPath "./RMCL4-${{ needs.version.outputs.v }}.win-x64.zip" -Force
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RMCL.win-x64.zip
          path: "./RMCL4-${{ needs.version.outputs.v }}.win-x64.zip"

  win-arm64:
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Sub-Module
        run: |
          git pull
          git submodule update --init --recursive --remote
          
      
      - name: Build (ARM64)
        run: |
          cd ./src/RMCL
          dotnet publish -c Release -r win-arm64 `
            /p:PublishSingleFile=true `
            /p:PublishReadyToRun=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:SelfContained=true `
            /p:Version=${{ needs.version.outputs.v }} `
            -o "../../publish/win-arm64" -p:DebugType=none -p:DebugSymbols=false
      
      - name: Create ZIP (ARM64)
        run: |
          Compress-Archive -Path "./publish/win-arm64/*" -DestinationPath "./RMCL4-${{ needs.version.outputs.v }}.win-arm64.zip" -Force
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RMCL.win-arm64.zip
          path: "./RMCL4-${{ needs.version.outputs.v }}.win-arm64.zip"

  # Linux 平台构建
  linux-x64:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Sub-Module
        run: |
          git pull
          git submodule update --init --recursive --remote
          
      
      - name: Build (Linux x64)
        run: |
          cd ./src/RMCL
          dotnet publish -c Release -r linux-x64 \
            /p:PublishSingleFile=true \
            /p:PublishReadyToRun=true \
            /p:IncludeNativeLibrariesForSelfExtract=true \
            /p:SelfContained=true \
            /p:Version=${{ needs.version.outputs.v }} \
            -o "../../publish/linux-x64" -p:DebugType=none -p:DebugSymbols=false
      
      - name: Create ZIP (Linux x64)
        run: |
          cd ./publish/linux-x64
          zip -r ../../RMCL4-${{ needs.version.outputs.v }}.linux-x64.zip *
          cd ../..
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RMCL.linux-x64.zip
          path: "./RMCL4-${{ needs.version.outputs.v }}.linux-x64.zip"

  linux-arm:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Sub-Module
        run: |
          git pull
          git submodule update --init --recursive --remote
          
      
      - name: Build (Linux ARM)
        run: |
          cd ./src/RMCL
          dotnet publish -c Release -r linux-arm \
            /p:PublishSingleFile=true \
            /p:PublishReadyToRun=true \
            /p:IncludeNativeLibrariesForSelfExtract=true \
            /p:SelfContained=true \
            /p:Version=${{ needs.version.outputs.v }} \
            -o "../../publish/linux-arm" -p:DebugType=none -p:DebugSymbols=false
      
      - name: Create ZIP (Linux ARM)
        run: |
          cd ./publish/linux-arm
          zip -r ../../RMCL4-${{ needs.version.outputs.v }}.linux-arm.zip *
