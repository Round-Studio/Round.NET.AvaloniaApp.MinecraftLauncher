  osx-arm64:
    needs: version
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Sub-Module
        run: |
          git pull
          git submodule update --init --recursive --remote
          
       
      - name: Build (macOS ARM64)
        run: |
          cd ./src/RMCL
          dotnet publish -c Release -r osx-arm64 \
            /p:PublishSingleFile=true \
            /p:PublishReadyToRun=true \
            /p:IncludeNativeLibrariesForSelfExtract=true \
            /p:SelfContained=true \
            /p:Version=${{ needs.version.outputs.v }} \
            -o "../../publish/osx-arm64" -p:DebugType=none -p:DebugSymbols=false
        
      - name: Create ZIP (macOS ARM64)
        run: |
          cd ./publish/osx-arm64
          zip -r ../../RMCL4-${{ needs.version.outputs.v }}.osx-arm64.zip *
          cd ../..
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RMCL.osx-arm64.zip
          path: "./RMCL4-${{ needs.version.outputs.v }}.osx-arm64.zip"

  # 发布阶段
  publish:
    needs: 
      - version
      - win-x86
      - win-x64
      - win-arm64
      - linux-x64
      - linux-arm
      - linux-arm64
      - osx-arm64
      - osx-x64
    runs-on: ubuntu-latest
    steps:
      - name: Prepare release info
        id: release
        run: |
          echo "date=$(date +'%Y-%m-%d.%H-%M-%S')" >> $GITHUB_OUTPUT
          echo "title=v${{ needs.version.outputs.v }}" >> $GITHUB_OUTPUT
          echo "tag=${{ needs.version.outputs.v }}" >> $GITHUB_OUTPUT

      - name: Download-RMCL.win-x86.zip
        uses: actions/download-artifact@v4
        with:
          name: RMCL.win-x86.zip
          path: ./artifacts/
      - name: Download-RMCL.win-x64.zip
        uses: actions/download-artifact@v4
        with:
          name: RMCL.win-x64.zip
          path: ./artifacts/
      - name: Download-RMCL.win-arm64.zip
        uses: actions/download-artifact@v4
        with:
          name: RMCL.win-arm64.zip
          path: ./artifacts/

      - name: Download-RMCL.linux-x64.zip
        uses: actions/download-artifact@v4
        with:
          name: RMCL.linux-x64.zip
          path: ./artifacts/
      - name: Download-RMCL.linux-arm.zip
        uses: actions/download-artifact@v4
        with:
          name: RMCL.linux-arm.zip
          path: ./artifacts/
      - name: Download-RMCL.linux-arm64.zip
        uses: actions/download-artifact@v4
        with:
          name: RMCL.linux-arm64.zip
          path: ./artifacts/

      - name: Download-RMCL.osx-arm64.zip
        uses: actions/download-artifact@v4
        with:
          name: RMCL.osx-arm64.zip
          path: ./artifacts/
      - name: Download-RMCL.osx-x64.zip
        uses: actions/download-artifact@v4
        with:
          name: RMCL.osx-x64.zip
          path: ./artifacts/

      - name: Publish Release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.TOKEN }}"
          title: "Preview v${{ needs.version.outputs.v }}"
          automatic_release_tag: "RMCL4.Preview-${{ needs.version.outputs.v }}"
          prerelease: false
          files: |
            ./artifacts/*.zip