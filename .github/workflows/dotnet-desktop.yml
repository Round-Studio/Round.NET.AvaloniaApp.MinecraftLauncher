      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RMCL.linux-arm.zip
          path: "./RMCL4-${{ needs.version.outputs.v }}.linux-arm.zip"

  linux-arm64:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Sub-Module
        run: |
          git pull
          git submodule update --init --recursive --remote
          
      
      - name: Build (Linux ARM64)
        run: |
          cd ./src/RMCL
          dotnet publish -c Release -r linux-arm64 \
            /p:PublishSingleFile=true \
            /p:PublishReadyToRun=true \
            /p:IncludeNativeLibrariesForSelfExtract=true \
            /p:SelfContained=true \
            /p:Version=${{ needs.version.outputs.v }} \
            -o "../../publish/linux-arm64" -p:DebugType=none -p:DebugSymbols=false
      
      - name: Create ZIP (Linux ARM64)
        run: |
          cd ./publish/linux-arm64
          zip -r ../../RMCL4-${{ needs.version.outputs.v }}.linux-arm64.zip *
